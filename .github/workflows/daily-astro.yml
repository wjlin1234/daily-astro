name: 每日自動更新上升星座運勢

on:
  schedule:
    # 每天 UTC 16:15（即台灣時間凌晨 00:15）自動執行
    - cron: '15 16 * * *'
  workflow_dispatch: # 保留手動觸發按鈕

jobs:
  update-fortune:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下載最新代碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 執行星盤計算與 AI 生成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generate.js

      - name: 自動儲存更新並推送到網頁
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fortune-today.json
          git commit -m "Auto update daily fortune [skip ci]" || echo "No changes to commit"
          git push
