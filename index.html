<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日上升星座運勢與財運指南 | 專業西洋占星分析</title>
  <meta name="description" content="結合精確全日星象天象配置，提供每日 12 上升星座的整體能量指引、財運佈局與行動建議。">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ZODIAC_LIST = [
      { key: "aries", name: "牡羊座", symbol: "♈", element: "火象" },
      { key: "taurus", name: "金牛座", symbol: "♉", element: "土象" },
      { key: "gemini", name: "雙子座", symbol: "♊", element: "風象" },
      { key: "cancer", name: "巨蟹座", symbol: "♋", element: "水象" },
      { key: "leo", name: "獅子座", symbol: "♌", element: "火象" },
      { key: "virgo", name: "處女座", symbol: "♍", element: "土象" },
      { key: "libra", name: "天秤座", symbol: "♎", element: "風象" },
      { key: "scorpio", name: "天蠍座", symbol: "♏", element: "水象" },
      { key: "sagittarius", name: "射手座", symbol: "♐", element: "火象" },
      { key: "capricorn", name: "摩羯座", symbol: "♑", element: "土象" },
      { key: "aquarius", name: "水瓶座", symbol: "♒", element: "風象" },
      { key: "pisces", name: "雙魚座", symbol: "♓", element: "水象" }
    ];

    const FALLBACK_DATA = {
      date: new Date().toISOString().split('T')[0],
      fortune: {
        aries: {
          overview: "今日能量聚焦點在內在梳理與節奏調整。適合將精力投入在具體且有實質進展的事項上。",
          wealth: "財運呈現穩健態勢，專注於既有資源的優化與長期配置。",
          action_tip: "給自己留出 15 分鐘的靜思時間，簡化代辦清單。"
        }
      }
    };

    function App() {
      const [selectedSign, setSelectedSign] = useState("aries");
      const [fortuneData, setFortuneData] = useState(FALLBACK_DATA);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetch('./fortune-today.json?t=' + new Date().getTime())
          .then(res => {
            if (!res.ok) throw new Error('Network response was not ok');
            return res.json();
          })
          .then(data => {
            setFortuneData(data);
            setLoading(false);
          })
          .catch(err => {
            console.log("讀取本地預設資料或檔案尚未生成");
            setLoading(false);
          });
      }, []);

      const currentSignInfo = ZODIAC_LIST.find(s => s.key === selectedSign) || ZODIAC_LIST[0];
      const currentFortune = (fortuneData.fortune && fortuneData.fortune[selectedSign]) 
        ? fortuneData.fortune[selectedSign] 
        : {
            overview: "今日整體運勢資料正在由 AI 解析同步中...",
            wealth: "今日財運分析正在同步中...",
            action_tip: "保持專注與正向能量。"
          };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between selection:bg-amber-400 selection:text-slate-950">
          <header className="border-b border-slate-800/80 bg-slate-900/40 backdrop-blur sticky top-0 z-10">
            <div className="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="text-xl">✨</span>
                <span className="font-bold tracking-wide bg-gradient-to-r from-amber-200 to-indigo-200 bg-clip-text text-transparent">
                  Daily Astro Insight
                </span>
              </div>
              <div className="text-xs text-slate-400 font-mono bg-slate-900 px-3 py-1 rounded-full border border-slate-800">
                📅 {fortuneData.date || '今日'}
              </div>
            </div>
          </header>

          <main className="max-w-4xl mx-auto px-4 py-8 sm:py-12 w-full space-y-8">
            <div className="text-center space-y-3">
              <h1 className="text-2xl sm:text-4xl font-extrabold tracking-tight text-slate-100">
                今日上升星座運勢與財運指南
              </h1>
              <p className="text-sm sm:text-base text-slate-400 max-w-xl mx-auto leading-relaxed">
                結合精確全日星象天象配置，為您的上升星座解析當日的整體能量焦點與資源配置建議。
              </p>
            </div>

            <div className="bg-slate-900/70 border border-slate-800 rounded-2xl p-6 shadow-2xl backdrop-blur max-w-xl mx-auto">
              <label className="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider text-center">
                請選擇您的「上升星座」
              </label>
              
              <div className="relative">
                <select
                  value={selectedSign}
                  onChange={(e) => setSelectedSign(e.target.value)}
                  className="w-full bg-slate-950 border-2 border-indigo-500/40 hover:border-indigo-400 focus:border-amber-400 text-slate-100 text-base font-medium rounded-xl px-4 py-3.5 outline-none transition appearance-none cursor-pointer text-center"
                >
                  {ZODIAC_LIST.map((sign) => (
                    <option key={sign.key} value={sign.key} className="bg-slate-900 text-slate-100 py-2">
                      {sign.symbol} 上升 {sign.name} ({sign.element})
                    </option>
                  ))}
                </select>
                <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path>
                  </svg>
                </div>
              </div>
            </div>

            <div className="bg-slate-900/50 border border-slate-800/80 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6 relative overflow-hidden">
              <div className="flex items-center justify-between border-b border-slate-800 pb-5">
                <div className="flex items-center gap-3">
                  <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500/20 to-amber-500/20 border border-indigo-500/30 flex items-center justify-center text-2xl text-amber-300">
                    {currentSignInfo.symbol}
                  </div>
                  <div>
                    <h2 className="text-xl sm:text-2xl font-bold text-slate-100">
                      上升 {currentSignInfo.name}
                    </h2>
                    <span className="text-xs text-slate-400">
                      {currentSignInfo.element}屬性能量指引
                    </span>
                  </div>
                </div>
                <div className="text-right">
                  <span className="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    今日適用
                  </span>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div className="bg-slate-950/70 border border-slate-800/80 rounded-2xl p-5 space-y-2">
                  <div className="flex items-center gap-2 text-indigo-400 font-semibold text-sm">
                    <span>🧭</span>
                    <h3>整體氣場與運勢解析</h3>
                  </div>
                  <p className="text-slate-300 text-sm leading-relaxed whitespace-pre-line">
                    {currentFortune.overview}
                  </p>
                </div>

                <div className="bg-slate-950/70 border border-slate-800/80 rounded-2xl p-5 space-y-2">
                  <div className="flex items-center gap-2 text-amber-400 font-semibold text-sm">
                    <span>💰</span>
                    <h3>財運與資源配置分析</h3>
                  </div>
                  <p className="text-slate-300 text-sm leading-relaxed whitespace-pre-line">
                    {currentFortune.wealth}
                  </p>
                </div>
              </div>

              <div className="bg-gradient-to-r from-indigo-950/40 via-slate-900/60 to-amber-950/40 border border-slate-800 rounded-2xl p-5 flex flex-col sm:flex-row items-start sm:items-center gap-3">
                <div className="p-2.5 bg-amber-400/10 text-amber-300 rounded-xl border border-amber-400/20 shrink-0">
                  ⚡
                </div>
                <div className="space-y-0.5">
                  <h4 className="text-xs font-bold text-amber-200 tracking-wide">今日行動錦囊</h4>
                  <p className="text-sm text-slate-300 leading-normal">
                    {currentFortune.action_tip}
                  </p>
                </div>
              </div>
            </div>

            <a
              href="https://wjlin1234.github.io/astro-action/"
              target="_blank"
              rel="noopener noreferrer"
              className="block bg-gradient-to-r from-amber-500 via-amber-400 to-indigo-400 rounded-3xl p-[1.5px] shadow-2xl shadow-amber-500/10 hover:shadow-amber-500/20 transition"
            >
              <div className="bg-slate-950 rounded-[calc(1.5rem-1.5px)] px-6 py-7 sm:px-8 sm:py-8 flex flex-col sm:flex-row items-center gap-5 sm:gap-6">
                <div className="text-4xl sm:text-5xl shrink-0">🔮</div>
                <div className="flex-1 text-center sm:text-left space-y-1.5">
                  <h3 className="text-lg sm:text-xl font-extrabold bg-gradient-to-r from-amber-200 to-indigo-200 bg-clip-text text-transparent">
                    免費個性分析，30 秒看懂真正的自己
                  </h3>
                </div>
                <div className="shrink-0 bg-gradient-to-r from-amber-400 to-amber-300 text-slate-950 font-bold text-sm px-6 py-3 rounded-xl whitespace-nowrap shadow-lg">
                  馬上開始 →
                </div>
              </div>
            </a>
          </main>

          <footer className="border-t border-slate-800/60 py-6 text-center text-xs text-slate-500">
            <p>© {new Date().getFullYear()} Daily Astro Tools. 依天文精確曆法與整星座宮位制計算。</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
